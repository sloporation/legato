<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Legato's icon: two notes as eyes, the legato slur bridging them as a smile. The master: full-bleed square (the system rounds
       the corners). Export with branding/export (see branding/README.md). -->
  <rect id="background" width="1024" height="1024" fill="#7E302A"/>
  <g fill="#FFFFFF">
    <!-- left note: head, and its stem rising from the head's right side -->
    <ellipse cx="372" cy="560" rx="112" ry="86" transform="rotate(-24 372 560)"/>
    <path d="M424 548 L424 280 A28 28 0 0 1 480 280 L480 548 Z"/>
    <!-- right note -->
    <ellipse cx="652" cy="560" rx="112" ry="86" transform="rotate(-24 652 560)"/>
    <path d="M704 548 L704 280 A28 28 0 0 1 760 280 L760 548 Z"/>
    <!-- the slur, as a smile: thick in the middle, tapering to round tips under each note -->
    <path d="M296 700 C 384 884, 640 884, 728 700 C 644 806, 380 806, 296 700 Z"
          stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round"/>
  </g>
</svg>
