# Legato for iPhone and Apple Watch. Generate the Xcode project with `xcodegen` (brew install xcodegen) in this folder; the .xcodeproj
# is not kept in git. DEVELOPMENT_TEAM is the team the App Store builds are signed for: to build to your own devices with another
# team, override it (xcodebuild DEVELOPMENT_TEAM=…, or Xcode's Signing & Capabilities).
name: Legato
options:
  bundleIdPrefix: com.sloporation
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"           # the version people see; CI sets it from the tag (v1.2.3)
    CURRENT_PROJECT_VERSION: "1"       # the build: every upload to App Store Connect needs a higher one (CI uses the run number)
    DEVELOPMENT_TEAM: TFV34V52U9
    CODE_SIGN_STYLE: Automatic

targets:
  Legato:
    type: application
    platform: iOS
    sources: [Legato, Shared]
    info:
      path: Legato/Info.plist
      properties:
        CFBundleDisplayName: Legato
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          # the phone's window, and CarPlay's (Legato/CarPlay.swift)
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Legato Desktop writes the synced music into Documents over USB (house_arrest), as Finder's file sharing does
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        # music keeps playing with the app in the background
        UIBackgroundModes: [audio]
        # no encryption beyond what iOS itself does: App Store Connect then doesn't ask about export compliance at each upload
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sloporation.legato
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon      # branding/icon.svg, exported by branding/export.sh
        # CarPlay needs Apple's CarPlay audio entitlement, which a build for a real iPhone can only have once Apple has granted it to
        # the team (developer.apple.com/contact/carplay). Until then, simulator builds only.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Legato/CarPlay.entitlements
    dependencies:
      - target: LegatoWatch

  LegatoWatch:
    type: application
    platform: watchOS
    sources: [LegatoWatch, Shared]
    info:
      path: LegatoWatch/Info.plist
      properties:
        CFBundleDisplayName: Legato
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.sloporation.legato
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sloporation.legato.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  LegatoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LegatoTests]
    dependencies:
      - target: Legato
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Legato:
    build:
      targets:
        Legato: all
        LegatoTests: [test]
    test:
      targets: [LegatoTests]
  LegatoWatch:
    build:
      targets:
        LegatoWatch: all
