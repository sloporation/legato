# Legato for iPhone and Apple Watch. Generate the Xcode project with `xcodegen` (brew install xcodegen) in this folder; the .xcodeproj
# is not kept in git. To run on your own devices, set DEVELOPMENT_TEAM below (or pick your team in Xcode's Signing & Capabilities).
name: Legato
options:
  bundleIdPrefix: com.sloporation
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Legato:
    type: application
    platform: iOS
    sources: [Legato, Shared]
    info:
      path: Legato/Info.plist
      properties:
        CFBundleDisplayName: Legato
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Legato Desktop writes the synced music into Documents over USB (house_arrest), as Finder's file sharing does
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        # music keeps playing with the app in the background
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sloporation.legato
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: LegatoWatch

  LegatoWatch:
    type: application
    platform: watchOS
    sources: [LegatoWatch, Shared]
    info:
      path: LegatoWatch/Info.plist
      properties:
        CFBundleDisplayName: Legato
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.sloporation.legato
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sloporation.legato.watchkitapp

  LegatoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LegatoTests]
    dependencies:
      - target: Legato
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Legato:
    build:
      targets:
        Legato: all
        LegatoTests: [test]
    test:
      targets: [LegatoTests]
  LegatoWatch:
    build:
      targets:
        LegatoWatch: all
