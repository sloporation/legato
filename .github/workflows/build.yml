# Builds everything: Legato Desktop for macOS, Linux and Windows (packaged as for a release), Legato for Android (an APK), and Legato
# for iPhone and Apple Watch (built, with the tests run).
#
#   push to dev, or a pull request into dev   the full build, to catch errors; the packages are kept on the run to try out
#   a tag v*  (git tag v0.1.0 && git push origin v0.1.0)   the same, then a GitHub release with the packages attached
name: Build

on:
  push:
    branches: [dev]
    tags: ['v*']
  pull_request:
    branches: [dev]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'
  TAGLIB_VERSION: 'v2.0.2'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        # v1.2.3 → 1.2.3 on a tag; 0.0.0 for builds of dev
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else echo "version=0.0.0" >> "$GITHUB_OUTPUT"; fi

  macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: brew install qt libyaml taglib pkgconf libimobiledevice libmtp
      - name: Build
        run: |
          cmake -S qt -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" -DLEGATO_VERSION=${{ needs.version.outputs.version }}
          cmake --build build --parallel
      - name: Package
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build/Legato.app -qmldir=qt/qml
          # macdeployqt rewrites the libraries it copies in without signing them again, and macOS kills such an app on Apple
          # silicon: sign it again (ad hoc, so it still asks for right-click › Open the first time; a Developer ID would not)
          codesign --force --deep --sign - build/Legato.app
          codesign --verify --deep --strict build/Legato.app
          hdiutil create -volname Legato -srcfolder build/Legato.app -ov -format UDZO "Legato-${{ needs.version.outputs.version }}-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Legato-*-macOS.dmg

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libyaml-dev pkg-config libimobiledevice-dev libmtp-dev ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libfuse2 zlib1g-dev
      - name: TagLib 2 (Ubuntu ships 1.x)
        run: |
          git clone --depth 1 --branch "$TAGLIB_VERSION" --recurse-submodules https://github.com/taglib/taglib.git /tmp/taglib
          cmake -S /tmp/taglib -B /tmp/taglib/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/taglib/build
          sudo cmake --install /tmp/taglib/build
          sudo ldconfig
      - name: Build
        run: |
          cmake -S qt -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DLEGATO_VERSION=${{ needs.version.outputs.version }}
          cmake --build build
      - name: Package (AppImage)
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1      # no FUSE on the runner
          QML_SOURCES_PATHS: ${{ github.workspace }}/qt/qml
          EXTRA_QT_MODULES: multimedia
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          cp qt/icons/legato-512.png legato.png
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -e build/legato -d qt/packaging/legato.desktop -i legato.png \
              --plugin qt --output appimage
          mv Legato-*.AppImage "Legato-${VERSION}-Linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Legato-*-Linux-x86_64.AppImage

  windows:
    needs: version
    runs-on: windows-2022
    # (not built on Windows before: until it has been, a failure here doesn't hold up the others)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Dependencies (vcpkg)
        run: vcpkg install taglib:x64-windows libyaml:x64-windows
      - name: Build
        run: |
          cmake -S qt -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DLEGATO_VERSION=${{ needs.version.outputs.version }}
          cmake --build build --config Release --parallel
      - name: Package
        run: |
          windeployqt --release --qmldir qt/qml build/Release/legato.exe
          Compress-Archive -Path build/Release/* -DestinationPath "Legato-${{ needs.version.outputs.version }}-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Legato-*-Windows-x64.zip

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Release key (when the ANDROID_KEYSTORE_* secrets are set; else the debug key signs it)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LEGATO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build and test
        working-directory: android
        env:
          LEGATO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LEGATO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LEGATO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --console=plain testReleaseUnitTest assembleRelease -PlegatoVersion=${{ needs.version.outputs.version }}
          mv app/build/outputs/apk/release/app-release.apk "../Legato-${{ needs.version.outputs.version }}-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Legato-*-Android.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          # the newest Xcode on the runner
          sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)"
          xcodebuild -version
      - name: Generate the project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build and test (iPhone, with the watch app embedded)
        run: |
          # the first available iPhone simulator on this machine
          sim=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          cd ios
          xcodebuild -project Legato.xcodeproj -scheme Legato -destination "id=$sim" -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO test
      # Installable builds (TestFlight) need an Apple Developer account's signing secrets; until then this checks it builds and passes.

  release:
    if: github.ref_type == 'tag'
    needs: [version, macos, linux, windows, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Legato ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: packages/*
